image: ruby:3.3

stages:
  - deploy

pages:
  stage: deploy
  variables:
    JEKYLL_ENV: production
    BUNDLE_PATH: vendor/bundle
  before_script:
    - gem install bundler --no-document
    - bundle install --jobs 4 --retry 3
  script:
    - |
      set -eu
      export SITE_BASEURL="$(ruby -ruri -e 'u=ENV["CI_PAGES_URL"]; puts(u && !u.empty? ? URI(u).path.sub(%r{/$}, "") : "")')"
      export SITE_ORIGIN="$(ruby -ruri -e 'u=ENV["CI_PAGES_URL"]; puts(u && !u.empty? ? "#{URI(u).scheme}://#{URI(u).host}" : "")')"
      bundle exec jekyll build --destination public --baseurl "$SITE_BASEURL" --url "$SITE_ORIGIN"
    - test -s public/index.html
    - test -s public/en/index.html
    - test -s public/de/index.html
    - test -s public/fr/index.html
    - test -s public/assets/css/kula.css
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  environment:
    name: production
    url: $CI_PAGES_URL
