image: ruby:3.3

stages:
  - deploy

pages:
  stage: deploy
  variables:
    JEKYLL_ENV: production
    BUNDLE_PATH: vendor/bundle
  before_script:
    - gem install bundler --no-document
    - bundle install --jobs 4 --retry 3
  script:
    - |
      export SITE_BASEURL="$(ruby -ruri -e 'u=ENV["CI_PAGES_URL"]; puts(u && !u.empty? ? (URI(u).path.sub(%r{/$}, "")) : "")')"
      echo "Building Jekyll site with baseurl: ${SITE_BASEURL}"
      bundle exec jekyll build --destination public --baseurl "${SITE_BASEURL}"
    - test -f public/index.html
    - test -f public/en/index.html
    - test -f public/de/index.html
    - test -f public/fr/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production
    url: $CI_PAGES_URL
