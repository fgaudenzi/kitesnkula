name: Deploy KITESNKULA to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build multilingual Jekyll site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby and Jekyll dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build website
        env:
          JEKYLL_ENV: production
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          # Jekyll 4 does not accept --url on the CLI: pass runtime URL settings as YAML.
          printf 'url: "%s"\nbaseurl: "%s"\n' "$PAGES_ORIGIN" "$PAGES_BASE_PATH" > "$RUNNER_TEMP/pages-config.yml"
          bundle exec jekyll build \
            --config "_config.yml,$RUNNER_TEMP/pages-config.yml" \
            --destination _site

      - name: Verify four languages and site assets
        shell: bash
        run: |
          set -euo pipefail
          for page in \
            _site/index.html \
            _site/en/index.html \
            _site/de/index.html \
            _site/fr/index.html \
            _site/trips/index.html \
            _site/assets/css/kula.css \
            _site/assets/js/kula.js \
            _site/assets/img/kula-mascot.svg \
            _site/assets/img/kula-opossum-antihero.avif \
            _site/assets/img/merch/hoodie-black.webp \
            _site/assets/img/merch/hoodie-purple.webp \
            _site/assets/img/merch/hoodie-crew.webp \
            _site/assets/img/camp/sardegna.jpg; do
            test -s "$page" || { echo "::error::Missing or empty: $page"; exit 1; }
          done
          for lang in '' en de fr; do
            if [[ -z "$lang" ]]; then page="_site/index.html"; else page="_site/$lang/index.html"; fi
            grep -q 'class="hero-title' "$page" || { echo "::error::Missing accessible hero text in $page"; exit 1; }
            grep -q 'class="trip-card' "$page" || { echo "::error::Missing trips in $page"; exit 1; }
            grep -q 'class="trip-antihero-title"' "$page" || { echo "::error::Trip heading missing in $page"; exit 1; }
            grep -q 'DISCUTIBILE\.' "$page" || { echo "::error::New trip claim missing in $page"; exit 1; }
            grep -q 'PUNTA TRETTU' "$page" || { echo "::error::Punta Trettu missing in $page"; exit 1; }
            if grep -q 'MASIRAH' "$page"; then echo "::error::Former Oman card remains in $page"; exit 1; fi
            [[ "$(grep -c 'class="trip-card"' "$page")" -eq 3 ]] || { echo "::error::Expected 3 trip cards in $page"; exit 1; }
            grep -q 'https://www.instagram.com/kitesnkula/' "$page" || { echo "::error::Official Instagram link missing in $page"; exit 1; }
            grep -q 'class="join-actions"' "$page" || { echo "::error::Contact buttons missing in $page"; exit 1; }
            grep -q 'id="merch"' "$page" || { echo "::error::Merch section missing in $page"; exit 1; }
            grep -q 'NO HEROES\.' "$page" || { echo "::error::Antihero manifesto heading missing in $page"; exit 1; }
            grep -q 'class="kula-strapline"' "$page" || { echo "::error::Manifesto strapline missing in $page"; exit 1; }
            grep -q 'kula-opossum-antihero.avif' "$page" || { echo "::error::Antihero opossum missing in $page"; exit 1; }
            if grep -Eiq '(^|[^[:alnum:]_])((the|la|die|zur)[[:space:]]+kula|kula[[:space:]]+life|vita[[:space:]]+di[[:space:]]+kula)([^[:alnum:]_]|$)' "$page"; then
              echo "::error::Old community naming still found in $page"
              exit 1
            fi
          done
          # Ensure the retired handwritten fonts are absent from published assets.
          if grep -Eiq 'Permanent Marker|Kalam|Comic Neue|Comic Sans' _site/assets/css/kula.css _site/index.html; then
            echo "::error::Deprecated handwritten font still referenced"
            exit 1
          fi
          for lang in '' en de fr; do
            if [[ -z "$lang" ]]; then page="_site/index.html"; else page="_site/$lang/index.html"; fi
            grep -q 'footer-wordmark claim-type' "$page" || { echo "::error::Footer wordmark missing in $page"; exit 1; }
          done

      - name: Mark generated site as static
        run: touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
