name: Build & publish KITESNKULA to GitLab Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitesnkula-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate Jekyll and four locales
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Ruby and bundle
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Compile Jekyll website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination public --baseurl /kitesnkula
      - name: Validate pages and independent assets
        shell: bash
        run: |
          set -euo pipefail
          for lang in '' en de fr; do
            if [[ -z "$lang" ]]; then page=public/index.html; else page="public/$lang/index.html"; fi
            test -s "$page" || { echo "::error::Missing translated page: $page"; exit 1; }
            grep -q 'class="hero-title' "$page" || { echo "::error::Missing HTML hero in $page"; exit 1; }
            grep -q 'class="trip-card' "$page" || { echo "::error::Missing trip cards in $page"; exit 1; }
          done
          test -s public/assets/css/kula.css
          test -s public/assets/img/kula-mascot.svg
          test -s public/assets/img/camp/oman-concept.svg
          test -s public/trips/index.html
          echo "Jekyll generated all languages and independent visual assets."
      - name: Archive verified static build
        uses: actions/upload-artifact@v4
        with:
          name: kitesnkula-site
          path: public/
          retention-days: 7

  publish:
    name: Sync master to GitLab (triggers GitLab Pages)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify GitLab connection
        env:
          GITLAB_REPOSITORY_URL: ${{ vars.GITLAB_REPOSITORY_URL }}
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GITLAB_REPOSITORY_URL" || -z "$GITLAB_PUSH_TOKEN" ]]; then
            echo "::error::Configure GitHub Actions variable GITLAB_REPOSITORY_URL (GitLab HTTPS clone URL) and secret GITLAB_PUSH_TOKEN (GitLab token with write_repository)."
            exit 1
          fi
          case "$GITLAB_REPOSITORY_URL" in
            https://*/*.git|https://*/*) ;;
            *) echo "::error::GITLAB_REPOSITORY_URL must be an HTTPS GitLab clone URL."; exit 1 ;;
          esac
      - name: Push the exact commit to GitLab master
        env:
          GITLAB_REPOSITORY_URL: ${{ vars.GITLAB_REPOSITORY_URL }}
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ASKPASS="$RUNNER_TEMP/gitlab-askpass.sh"
          cat > "$ASKPASS" <<'SCRIPT'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s' 'oauth2' ;;
            *Password*) printf '%s' "$GITLAB_PUSH_TOKEN" ;;
            *) printf '' ;;
          esac
          SCRIPT
          chmod 700 "$ASKPASS"
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git -c credential.helper= push "$GITLAB_REPOSITORY_URL" HEAD:refs/heads/master
          echo "GitLab master received $GITHUB_SHA; its Pages pipeline will publish public/."
