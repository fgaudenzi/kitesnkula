{% assign copy = site.translations[site.lang].kula %}
{% assign home_url = '/' | relative_url %}
<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="{{ home_url }}" aria-label="KITESNKULA home">
      <span class="brand-word">KITESNKULA</span>
    </a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="{{ copy.nav.menu }}"><span></span><span></span><span></span></button>
    <nav id="primary-nav" class="primary-nav" aria-label="{{ copy.nav.navigation }}">
      <a href="{{ home_url }}#kula">{{ copy.nav.kula }}</a>
      <a href="{{ home_url }}#trips">{{ copy.nav.trips }}</a>
      <a href="{{ home_url }}#crew">{{ copy.nav.crew }}</a>
      <a href="{{ home_url }}#stories">{{ copy.nav.stories }}</a>
    </nav>
    <div class="nav-actions">
      <div class="lang-switch" aria-label="{{ copy.nav.language }}">
        {% for lang in site.languages %}
          <a href="{{ site.baseurl_root }}/{% unless lang == site.default_lang %}{{ lang }}/{% endunless %}" lang="{{ lang }}" hreflang="{{ lang }}" {% if lang == site.lang %}aria-current="true" class="active"{% endif %}>{{ lang | upcase }}</a>
        {% endfor %}
      </div>
      <a class="button button-purple nav-join" href="{{ home_url }}#join">{{ copy.nav.join }} <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</header>
