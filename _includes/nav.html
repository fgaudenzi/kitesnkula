{% assign c = site.translations[site.lang].kula %}
{% assign home = '/' | relative_url %}
<header class="site-header">
  <div class="site-nav container-wide">
    <a class="nav-logo marker" href="{{ home }}" aria-label="KITESNKULA, home">KITESNKULA</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-links" aria-label="{{ c.nav.menu }}"><span></span><span></span><span></span></button>
    <nav class="nav-links" id="primary-links" aria-label="{{ c.nav.navigation }}">
      <a href="{{ home }}#top">{{ c.nav.home }}</a>
      <a href="{{ home }}#kula">{{ c.nav.kula }}</a>
      <a href="{{ home }}#trips">{{ c.nav.trips }}</a>
      <a href="{{ home }}#crew">{{ c.nav.crew }}</a>
      <a href="{{ home }}#stories">{{ c.nav.stories }}</a>
      <a href="{{ home }}#merch">{{ c.nav.merch }}</a>
    </nav>
    <div class="nav-tools">
      <nav class="lang-switch" aria-label="{{ c.nav.language }}">
        {% for lang in site.languages %}
          <a href="{{ site.baseurl_root }}/{% unless lang == site.default_lang %}{{ lang }}/{% endunless %}" hreflang="{{ lang }}" lang="{{ lang }}" {% if lang == site.lang %}aria-current="page" class="active"{% endif %}>{{ lang | upcase }}</a>
        {% endfor %}
      </nav>
      <a class="brush-button purple-button nav-join" href="{{ home }}#join">{{ c.nav.join }} <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</header>
