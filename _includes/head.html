<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {% assign copy = site.translations[site.lang].kula %}
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ copy.meta_description | default: site.description | escape }}">
  <meta name="theme-color" content="#f5f0e7">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }} — {{ copy.hero.first | escape }} {{ copy.hero.second | escape }}">
  <meta property="og:description" content="{{ copy.meta_description | escape }}">
  <meta property="og:image" content="{{ '/assets/img/header.jpg' | prepend: site.baseurl_root }}">
  {% if site.url != empty %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
  {% if site.url != empty %}{% for lang in site.languages %}
    <link rel="alternate" hreflang="{{ lang }}" href="{{ site.url }}{{ site.baseurl_root }}{% unless lang == site.default_lang %}/{{ lang }}{% endunless %}{{ page.url }}">
  {% endfor %}{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link href="{{ '/assets/css/kula.css' | prepend: site.baseurl_root }}" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/kula-mascot.svg' | prepend: site.baseurl_root }}">
</head>
